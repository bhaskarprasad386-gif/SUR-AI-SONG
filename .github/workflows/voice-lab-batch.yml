name: Apply Voice Lab Batch
on:
  push:
    paths:
      - '.github/workflows/voice-lab-batch.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve recording capture and cleanup chain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text()
          old="navigator.mediaDevices.getUserMedia({audio:true})"
          new="navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}})"
          if old not in s:
              raise SystemExit('recording anchor not found')
          s=s.replace(old,new,1)
          old2="const offline=new OfflineAudioContext(outputChannels,outputFrames,outputRate),source=offline.createBufferSource(),hp=offline.createBiquadFilter(),comp=offline.createDynamicsCompressor();"
          new2="const offline=new OfflineAudioContext(outputChannels,outputFrames,outputRate),source=offline.createBufferSource(),hp=offline.createBiquadFilter(),lp=offline.createBiquadFilter(),comp=offline.createDynamicsCompressor(),limiter=offline.createDynamicsCompressor();"
          if old2 not in s:
              raise SystemExit('cleanup chain anchor not found')
          s=s.replace(old2,new2,1)
          old3="hp.type='highpass';hp.frequency.value=80;hp.Q.value=.707;comp.threshold.value=-22;comp.knee.value=18;comp.ratio.value=3;comp.attack.value=.008;comp.release.value=.22;source.connect(hp);hp.connect(comp);comp.connect(offline.destination);"
          new3="hp.type='highpass';hp.frequency.value=80;hp.Q.value=.707;lp.type='lowpass';lp.frequency.value=14500;lp.Q.value=.707;comp.threshold.value=-22;comp.knee.value=18;comp.ratio.value=3;comp.attack.value=.008;comp.release.value=.22;limiter.threshold.value=-3;limiter.knee.value=3;limiter.ratio.value=20;limiter.attack.value=.002;limiter.release.value=.12;source.connect(hp);hp.connect(lp);lp.connect(comp);comp.connect(limiter);limiter.connect(offline.destination);"
          if old3 not in s:
              raise SystemExit('cleanup settings anchor not found')
          s=s.replace(old3,new3,1)
          old4="<small>मुफ्त browser processing: 80 Hz low-rumble filter, gentle compressor और peak leveling। ऑडियो आपके डिवाइस पर process होता है। यह AI denoising या pitch correction नहीं है और background noise पूरी तरह नहीं हटाता।</small>"
          new4="<small>मुफ्त browser processing: microphone noise-suppression, 80 Hz rumble filter, 14.5 kHz cleanup, gentle compression और final peak limiting। ऑडियो आपके डिवाइस पर process होता है। यह AI denoising या pitch correction नहीं है और background noise पूरी तरह नहीं हटाता।</small>"
          if old4 not in s:
              raise SystemExit('voice notice anchor not found')
          s=s.replace(old4,new4,1)
          old5="notify('Basic cleanup तैयार: rumble filter, gentle compression और peak leveling।')"
          new5="notify('Studio cleanup तैयार: rumble/high-frequency cleanup, gentle compression और peak limiting।')"
          if old5 not in s:
              raise SystemExit('cleanup message anchor not found')
          s=s.replace(old5,new5,1)
          p.write_text(s)
          PY
      - name: Commit changes and remove one-off workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx .github/workflows/voice-lab-batch.yml
          git rm .github/workflows/voice-lab-batch.yml
          git commit -m 'feat: upgrade Voice Lab recording and studio cleanup' || exit 0
          git push origin HEAD:main
